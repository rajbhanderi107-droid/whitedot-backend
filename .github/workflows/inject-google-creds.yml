name: Inject Google credentials into VPS env

on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Inject env vars via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GA4_PROPERTY_ID,GSC_SITE_URL,GOOGLE_SERVICE_ACCOUNT_JSON
          script: |
            set -e
            ENV_FILE=/opt/whitedot-backend/.env

            sed -i '/^GA4_PROPERTY_ID=/d' "$ENV_FILE"
            sed -i '/^GSC_SITE_URL=/d' "$ENV_FILE"
            sed -i '/^GOOGLE_SERVICE_ACCOUNT_JSON=/d' "$ENV_FILE"

            echo "GA4_PROPERTY_ID=\"$GA4_PROPERTY_ID\"" >> "$ENV_FILE"
            echo "GSC_SITE_URL=\"$GSC_SITE_URL\"" >> "$ENV_FILE"
            echo "GOOGLE_SERVICE_ACCOUNT_JSON=$GOOGLE_SERVICE_ACCOUNT_JSON" >> "$ENV_FILE"

            docker compose -f /opt/whitedot-backend/docker-compose.yml up -d
            sleep 8
            curl -sf http://localhost:4000/api/health && echo "Health OK"
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
