name: Deploy backend (Google Cloud Run)

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'docker-entrypoint.sh'
  workflow_dispatch:

env:
  PROJECT_ID: fresh-strategy-497720-q7
  REGION: asia-south1
  SERVICE: whitedot-backend
  IMAGE: asia-south1-docker.pkg.dev/fresh-strategy-497720-q7/whitedot/backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest .
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image "$IMAGE:$GITHUB_SHA" \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 5 \
            --memory 512Mi \
            --cpu 1 \
            --port 4000 \
            --set-env-vars="^|^NODE_ENV=production|PORT=4000|FRONTEND_URL=${{ secrets.FRONTEND_URL }}|FRONTEND_ORIGINS=${{ secrets.FRONTEND_ORIGINS }}|DATABASE_URL=${{ secrets.DATABASE_URL }}|DIRECT_URL=${{ secrets.DIRECT_URL }}|JWT_SECRET=${{ secrets.JWT_SECRET }}|ADMIN_SEED_EMAIL=${{ secrets.ADMIN_SEED_EMAIL }}|ADMIN_SEED_PASSWORD=${{ secrets.ADMIN_SEED_PASSWORD }}|GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}|GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}|GOOGLE_AI_KEY=${{ secrets.GOOGLE_AI_KEY }}"

      - name: Show service URL
        run: |
          gcloud run services describe $SERVICE --region $REGION \
            --format='value(status.url)'
