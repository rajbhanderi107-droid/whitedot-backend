name: Deploy backend to Hostinger VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/whitedot-backend
            git fetch origin master
            git reset --hard origin/master
            docker compose up --build -d
            docker image prune -f
            echo "Deploy done: $(date)"
            sleep 8
            curl -sf http://localhost:4000/api/health && echo "Health OK" || (docker compose -f /opt/whitedot-backend/docker-compose.yml logs --tail=30 api && echo "Health check FAILED" && exit 1)
