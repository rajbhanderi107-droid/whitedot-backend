# Local development only — production uses Cloud Run + Supabase
services:
  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: whitedot
      POSTGRES_USER: whitedot
      POSTGRES_PASSWORD: localdev

  api:
    build: .
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  pgdata:
